<div id="cloud-glass-studio-universal" class="inline-drawer cgs2">
 <div class="inline-drawer-toggle inline-drawer-header"><b>☁️ 云雾玻璃控制台</b><div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div></div>
 <div class="inline-drawer-content cgs2-content">
  <p class="cgs2-intro">调节玻璃与文字效果，修改会立即预览并自动保存。</p>
  <section class="cgs2-section">
   <div class="cgs2-section-title">玻璃效果</div>
   <label class="cgs2-control"><span>毛玻璃模糊 <output data-cgs2-output="blur">8 px</output></span><input data-cgs2-key="blur" type="range" min="0" max="16" step="1"></label>
   <label class="cgs2-control"><span>玻璃透明度 <output data-cgs2-output="opacity">42%</output></span><input data-cgs2-key="opacity" type="range" min="0" max="70" step="1"></label>
   <label class="cgs2-control"><span>玻璃底色</span><input data-cgs2-key="glassColor" type="color"></label>
   <label class="cgs2-control"><span>顶部与底栏透明度 <output data-cgs2-output="barOpacity">32%</output></span><input data-cgs2-key="barOpacity" type="range" min="0" max="85" step="1"></label>
  </section>
  <section class="cgs2-section">
   <div class="cgs2-section-title">字体与排版</div>
   <label class="cgs2-control"><span>正文字体</span><select data-cgs2-key="font"><option value="serif">系统衬线字体</option><option value="sans-serif">系统无衬线字体</option><option value="Noto Serif SC">Noto Serif SC</option><option value="KaiTi">楷体（设备支持时）</option><option value="ChillHuoSong_F">ChillHuoSong_F</option></select></label>
   <label class="cgs2-control"><span>正文字号 <output data-cgs2-output="fontSize">1.00 rem</output></span><input data-cgs2-key="fontSize" type="range" min="0.85" max="1.35" step="0.01"></label>
  </section>
  <section class="cgs2-section">
   <div class="cgs2-section-title">文字颜色</div>
   <label class="cgs2-control"><span>正文</span><input data-cgs2-key="bodyColor" type="color"></label>
   <label class="cgs2-control"><span>灰色 / 斜体 / 次要文字</span><input data-cgs2-key="secondaryColor" type="color"></label>
   <label class="cgs2-control"><span>引用 / 强调文字</span><input data-cgs2-key="quoteColor" type="color"></label>
  </section>
  <section class="cgs2-section">
   <div class="cgs2-section-title">主题适配</div>
   <label class="cgs2-control"><span>当前美化方案</span><select data-cgs2-adapter><option value="native">通用 / SillyTavern 原生</option><option value="baseL">Base_L</option><option value="duoBox">双色盒子 · 浅色毛玻璃</option></select></label>
   <p class="cgs2-help">适配规则在后台自动处理，无需手动编辑 CSS 选择器。</p>
  </section>
  <section class="cgs2-section">
   <div class="cgs2-section-title">我的主题模板</div>
   <div class="cgs2-template-list" data-cgs2-template-list></div>
   <button type="button" class="cgs2-save-template" data-save-template>＋ 保存当前参数为新模板</button>
  </section>
  <div class="cgs2-actions"><button type="button" data-cgs2-reset>恢复默认参数</button><span data-cgs2-status>修改会自动保存</span></div>
  <p class="cgs2-note">模板保存在当前酒馆的扩展设置中。可以随时新增、应用或删除；适配方案与模板参数相互独立。</p>
 </div>
</div>
